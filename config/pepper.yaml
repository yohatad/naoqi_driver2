# Single configuration for naoqi_driver on Pepper.
#
# This replaces editing config/boot_config.json. Every converters.* setting
# below is a ROS parameter whose default comes from that JSON, so whatever is
# set here wins and the share copy can be left alone.
#
#   ros2 launch naoqi_driver naoqi_driver.launch.py \
#       nao_ip:=<robot ip> params_file:=<this file>
#
# The converters.* keys are read_only: they take effect at start-up, because
# the converters are created once. Changing one needs a driver restart.
/**:
  ros__parameters:

    # --- connection ---------------------------------------------------------
    # nao_ip is left to the launch argument so the file is not robot-specific.
    nao_port: 9559

    # --- safety: the coarse laser/sonar/bumper backstop ---------------------
    # Off by default in code. Ranges sit INSIDE Nav2's 0.40/0.90 m wedges so
    # this never fires first: it is a backstop, not a second opinion.
    # It gates forward motion only -- rotation is never blocked.
    proximity_guard: true
    proximity_stop_range: 0.35       # m from base_footprint, blocks forward
    proximity_slow_range: 0.60       # m, scales forward by 0.3
    proximity_half_angle: 1.0472     # rad, 60 deg half-arc
    proximity_min_hits: 2            # 1 lets one specular glitch stop it
    proximity_source_timeout: 1.0    # s before a reading stops counting
    proximity_bumper_clear_delay: 1.0

    # --- velocity limits and the command watchdog ---------------------------
    # cmd_vel_timeout 0.5 is the shipped default, repeated for visibility.
    cmd_vel_timeout: 0.5
    # NOT the default: both ship as 0.0, and limitVelocity() treats 0 as
    # uncapped. These impose Nav2's vx_max 0.35 / wz_max 0.3 at the driver, so
    # a command from anywhere cannot exceed the speed the 0.40 m stop polygon
    # was sized for -- B13's stopping arithmetic assumes 0.35 m/s. Set both to
    # 0.0 to restore the uncapped behaviour.
    max_linear_speed: 0.35
    max_angular_speed: 0.3

    # --- sensors ------------------------------------------------------------
    # NOT set here on purpose. Which converters run, and at what rate, is
    # config/boot_config.json's job, and it already enables the laser, both
    # sonars and the bumper while disabling the cameras, audio, logs, diag,
    # imu_torso and the touch sensors. Repeating those keys here would mean two
    # places to drift: the compiled defaults in boot_config.hpp are all-on, so
    # the JSON is what turns the rest off. Override one only if you mean to,
    # e.g.  converters.laser.frequency: 20
    publish_wheel_odom_tf: false
