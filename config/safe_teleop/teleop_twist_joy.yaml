# Joystick to velocity, only while the enable button is held: releasing it sends
# one zero velocity, and the driver stops the base 0.5 s after the last command.
# Numbers are for an Xbox-style pad on Linux; check yours with `ros2 topic echo /joy`.
teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4  # LB: hold to move
    enable_turbo_button: -1  # no turbo
    axis_linear:
      x: 1  # left stick, forward and back
      y: 0  # left stick, sideways (Pepper's base is holonomic)
    scale_linear:
      x: 0.2  # m/s
      y: 0.2
    axis_angular:
      yaw: 3  # right stick, left and right
    scale_angular:
      yaw: 0.5  # rad/s
