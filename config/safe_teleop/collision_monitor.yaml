# Slows, then stops, motion towards what Pepper's laser and sonars see. Motion
# away from an obstacle stays allowed, so the robot cannot get stuck next to one.
# Needs converters laser and sonar enabled in the driver.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_teleop"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: false  # so that no odom frame is needed
    stop_pub_timeout: 1.0
    polygons: ["Slowdown", "Footprint"]
    # Half speed with an obstacle within 0.6 m of the base centre.
    Slowdown:
      type: "circle"
      radius: 0.6
      action_type: "slowdown"
      slowdown_ratio: 0.5
      max_points: 3
      visualize: true
      polygon_pub_topic: "collision_monitor/slowdown"
    # Pepper's base (about 0.25 m) plus 0.1 m: the robot slows so that it would
    # reach an obstacle with this circle in no less than 1 s, so it stops before.
    Footprint:
      type: "circle"
      radius: 0.35
      action_type: "approach"
      time_before_collision: 1.0
      simulation_time_step: 0.05
      max_points: 3
      visualize: true
      polygon_pub_topic: "collision_monitor/footprint"
    # sonar_back is NOT a source: it is physically obstructed on this robot and
    # reads a constant 0.360-0.370 m (std 0.001, MEASURED). Its field of view
    # over obstacles_angle yields more than max_points, so on its own it pinned
    # a 0.2 m/s forward command to 0.04 m/s on 100% of ticks -- it crippled
    # driving forward while sensing nothing. Reverse is therefore unsensed here,
    # which the obstruction already made true; the source only hid it.
    observation_sources: ["laser", "sonar_front"]
    laser:
      type: "scan"
      topic: "laser"
    sonar_front:
      type: "range"
      topic: "sonar/front"
      obstacles_angle: 0.15
